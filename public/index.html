<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor for Rural Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.10);--ink:#f4f6f5;--mut:#98a39d;--g1:#7FCBA2;--g2:#3fd0c9;--amb:#F2A541;--bad:#ef6a4c;--on:#04130c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15.5px/1.6 Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 85% -10%,rgba(127,203,162,.20),transparent 60%),radial-gradient(700px 520px at -10% 110%,rgba(242,165,65,.12),transparent 60%),#000;background-attachment:fixed}
.app{display:grid;grid-template-columns:330px 1fr;height:100vh;max-width:1300px;margin:0 auto}
.side{padding:26px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);display:grid;place-items:center;font-weight:700;font-size:22px;box-shadow:0 8px 24px rgba(127,203,162,.35)}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:12.5px;margin:0}
label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:500}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;outline:none;transition:.2s}
select:focus,input:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(127,203,162,.18)}
option{background:#111}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--g1);transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-color:transparent;font-weight:600}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 11px;transition:.25s}
.st i{width:8px;height:8px;border-radius:50%;background:#333}
.st.on{color:#000;background:var(--amb);border-color:var(--amb);font-weight:600;box-shadow:0 6px 20px rgba(242,165,65,.35)}
.st.on i{background:#000}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px;line-height:1.1;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:12.5px}
.main{display:flex;flex-direction:column;height:100vh;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--line)}
.top b{font-weight:600}
.live{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g1);box-shadow:0 0 10px var(--g1)}
#chat{flex:1;overflow-y:auto;padding:26px 32px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hello{margin:auto;text-align:center;max-width:560px;animation:up .6s both}
.hello h2{font-size:36px;line-height:1.2;margin:0 0 10px;letter-spacing:-.8px;font-weight:700}
.hello h2 span{background:linear-gradient(135deg,var(--g1),var(--amb));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--mut);margin:0 0 24px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.sug{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;transition:.25s;display:flex;gap:12px;align-items:flex-start}
.sug:hover{transform:translateY(-3px);border-color:var(--g1);background:var(--glass2)}
.sug .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--g1),var(--g2))}
.sug small{display:block;color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;align-items:flex-end;animation:up .35s both}
.av{flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);display:grid;place-items:center;font-weight:700;font-size:14px}
.m{padding:12px 17px;border-radius:20px;max-width:76%;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-bottom-right-radius:6px;font-weight:500;animation:up .35s both}
.ai{background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:6px}
.sys{align-self:center;color:var(--mut);font-size:13px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--g1);animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:640px;margin-bottom:10px;animation:up .3s both}
.q button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:8px;cursor:pointer;transition:.2s}
.q button:hover:not(:disabled){border-color:var(--g1)}
.q .ok{background:var(--g1);color:var(--on);border-color:var(--g1)}
.q .no{background:var(--bad);color:#fff;border-color:var(--bad)}
.foot{padding:14px 32px 22px;border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:13.5px;min-height:20px}
.bar{display:flex;gap:10px}
.bar input{flex:1;padding:13px 16px;border-radius:16px}
.go{font:inherit;font-weight:600;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;border-radius:16px;padding:0 26px;cursor:pointer;transition:.2s;box-shadow:0 8px 22px rgba(127,203,162,.3)}
.go:hover:not(:disabled){transform:translateY(-1px)}
.go:disabled,.act:disabled{opacity:.5}
.acts{display:flex;gap:10px;margin-top:10px}
.act{font:inherit;font-size:13.5px;background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:.2s}
.act:hover:not(:disabled){border-color:var(--g1)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#222;border-radius:8px}
@media(max-width:820px){
 html,body{height:auto}
 .app{display:block;height:auto}
 .side{border-right:0;border-bottom:1px solid var(--line);padding:18px 16px;gap:16px}
 .top{padding:12px 16px}
 .main{height:88vh}
 #chat{padding:16px}.foot{padding:12px 16px 18px}
 .m{max-width:90%}.sugs{grid-template-columns:1fr}.hello h2{font-size:27px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="logo">A</div><div><h1>AI Tutor</h1><p class="sub">SDG 4: Quality Education</p></div></div>
 <div class="grid2">
  <div><label for="lang">Language</label><select id="lang"><option>English</option><option>Hindi</option><option>Marathi</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Bengali</option><option>Gujarati</option><option>Punjabi</option></select></div>
  <div><label for="grade">Class</label><select id="grade"><option>Class 6</option><option>Class 7</option><option selected>Class 8</option><option>Class 9</option><option>Class 10</option></select></div>
 </div>
 <div><label>Subject</label><div class="chips" id="chips"></div></div>
 <div><label>Agent loop</label><div class="steps"><div class="st" id="s1"><i></i>Perceive</div><div class="st" id="s2"><i></i>Plan</div><div class="st" id="s3"><i></i>Act</div><div class="st" id="s4"><i></i>Learn</div></div></div>
 <div class="grid2">
  <div class="stat"><b id="score">0/0</b><span>Quiz score</span></div>
  <div class="stat"><b id="wk">0</b><span id="weak">Weak topics</span></div>
 </div>
</aside>
<section class="main">
 <div class="top"><b>Your learning space</b><span class="live"><i></i>Tutor online</span></div>
 <div id="chat">
  <div class="hello" id="hello">
   <h2>What do you want to <span>learn today?</span></h2>
   <p>Ask anything from Class 6-10, in your own language.</p>
   <div class="sugs" id="sugs"></div>
  </div>
 </div>
 <div class="foot">
  <div id="quiz"></div>
  <div class="err" id="err"></div>
  <div class="bar"><input id="inp" placeholder="Ask a question or type a topic" aria-label="Message"><button class="go" id="send">Send</button></div>
  <div class="acts"><button class="act" id="teach">Teach me</button><button class="act" id="qz">Quiz me</button></div>
 </div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const subjects=["Any subject","Maths","Science","Social studies","English","Computers"];
let subject=subjects[0],history=[],score={c:0,t:0},weak={},busy=false;
subjects.forEach(s=>{const b=document.createElement("button");b.className="chip"+(s===subject?" on":"");b.textContent=s;b.onclick=()=>{subject=s;[...$("chips").children].forEach(x=>x.classList.toggle("on",x===b))};$("chips").appendChild(b)});
[["Teach me fractions","Maths","M"],["How does photosynthesis work?","Science","S"],["Explain the Indian freedom struggle","Social studies","H"],["What is a variable in coding?","Computers","C"]].forEach(([t,s,i])=>{const b=document.createElement("button");b.className="sug";b.innerHTML='<span class="ic">'+i+'</span><span>'+t+'<small>'+s+'</small></span>';b.onclick=()=>ask(t);$("sugs").appendChild(b)});
function setStep(n){["s1","s2","s3","s4"].forEach((id,i)=>$(id).classList.toggle("on",i===n-1))}
function down(){const c=$("chat");c.scrollTop=c.scrollHeight}
function add(cls,txt){const h=$("hello");if(h)h.remove();const d=document.createElement("div");d.className="m "+cls;d.textContent=txt;
 if(cls==="ai"){const r=document.createElement("div");r.className="row";const a=document.createElement("div");a.className="av";a.textContent="A";r.appendChild(a);r.appendChild(d);$("chat").appendChild(r)}else $("chat").appendChild(d);
 down();return d}
function stats(){$("score").textContent=score.c+"/"+score.t;const w=Object.keys(weak);$("wk").textContent=w.length;$("weak").textContent=w.length?"Weak: "+w.slice(0,2).join(", "):"Weak topics"}
async function callAI(prompt,json){const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json})});if(!r.ok){const e=new Error("fail");e.code=r.status===429?"rate_limited":"error";try{const j=await r.json();e.detail=(j.detail||j.error||"")}catch(_){}e.status=r.status;throw e}return r.json()}
function profile(){return "Student: "+$("grade").value+", subject: "+subject+", language: "+$("lang").value+". Weak topics: "+(Object.keys(weak).join(", ")||"none")+". Quiz score: "+score.c+"/"+score.t+"."}
function lock(v){busy=v;["send","teach","qz"].forEach(i=>$(i).disabled=v)}
async function ask(text){
 if(busy)return;lock(true);$("err").textContent="";setStep(1);add("me",text);history.push("Student: "+text);
 const prompt="You are a friendly AI tutor for rural students in India who can teach any school subject. Reply ONLY in "+$("lang").value+" (use its native script), in very simple words. Explain one idea at a time with a short everyday example, keep it under 120 words, use plain text with no markdown, and end with one short question to check understanding. Adapt to the student's level and revisit weak topics.\n"+profile()+"\nConversation so far:\n"+history.slice(-10).join("\n")+"\nTutor:";
 const out=add("ai","");out.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 try{setStep(2);const r=await callAI(prompt,false);setStep(3);out.textContent=r.text;history.push("Tutor: "+r.text);down();setStep(4)}
 catch(e){(out.closest(".row")||out).remove();$("err").textContent=e&&e.code==="rate_limited"?"Too many requests. Wait a moment and try again.":"Could not reach the AI tutor ("+(e&&e.status||"network")+"). "+((e&&e.detail)||"Please try again.")}
 lock(false);
}
$("send").onclick=()=>{const v=$("inp").value.trim();if(!v){$("err").textContent="Type a question first.";return}$("inp").value="";ask(v)};
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
$("teach").onclick=()=>ask(subject==="Any subject"?"Pick a useful topic for my class and teach me the basics.":"Teach me the basics of "+subject+" for my class.");
$("qz").onclick=async()=>{
 if(busy)return;lock(true);$("err").textContent="";setStep(2);$("quiz").innerHTML="";
 const topic=history.length?history.slice(-6).join("\n"):"general "+subject+" for "+$("grade").value;
 try{
  const qs=(await callAI("Create 3 multiple-choice questions in "+$("lang").value+" for a "+$("grade").value+" student, based on this lesson or topic (focus on weak topics: "+(Object.keys(weak).join(", ")||"none")+"):\n"+topic+"\nReturn ONLY JSON: {\"questions\":[{\"q\":\"\",\"options\":[\"\",\"\",\"\",\"\"],\"answer\":0,\"topic\":\"short topic name\"}]} where answer is the index of the correct option.",true)).data;
  setStep(3);let i=0,right=0;const list=qs.questions||[];
  const show=()=>{
   if(i>=list.length){$("quiz").innerHTML="";add("sys","Quiz done: "+right+"/"+list.length+".");history.push("Quiz result: "+right+" of "+list.length+" correct. Weak topics: "+(Object.keys(weak).join(", ")||"none"));setStep(4);lock(false);return}
   const q=list[i],box=document.createElement("div");box.className="q";box.textContent=(i+1)+". "+q.q;
   q.options.forEach((o,k)=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{[...box.querySelectorAll("button")].forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add("ok")});score.t++;if(k===q.answer){score.c++;right++}else{b.classList.add("no");weak[q.topic||subject]=1}stats();setTimeout(()=>{i++;show()},1100)};box.appendChild(b)});
   $("quiz").innerHTML="";$("quiz").appendChild(box);
  };
  if(!list.length)throw new Error("empty");show();
 }catch(e){$("err").textContent="Could not make a quiz. Try again.";lock(false)}
};
stats();
</script>
</body>
</html>
